name: Build and release plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Match the supported Linux baseline of the locked Playwright 1.58.2.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check versions and release compatibility declaration
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json'));
          const manifest = JSON.parse(readFileSync('plugin/manifest.json'));
          assert.equal(pkg.version, manifest.version);
          if (process.env.RELEASE_TAG) {
            assert.equal(process.env.RELEASE_TAG, `v${manifest.version}`);
            assert.match(manifest.minHostVersion || '', /^\d+\.\d+\.\d+$/, 'An explicit host-version installation floor is required before publishing');
          }
          NODE
      - run: npm run build
      - name: Verify archive digest
        working-directory: dist
        run: sha256sum --check *.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nixie-clock-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nixie-clock-package
          path: dist
      - name: Publish the CI-built package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 \
            --verify-tag --title "辉光管时钟 $RELEASE_TAG" \
            --notes '透明桌面辉光管时钟。当前已发布宿主不兼容，兼容宿主尚未发布；0.33.0 是预留安装门槛，并非已发布兼容版本的承诺。插件还会检查所需桌面窗口接口，缺失时明确报不兼容且不启动后台提醒。宿主仍通过受邀测试渠道提供。安装包由本仓库 GitHub Actions 构建，摘要见同名 SHA-256 文件。'
